<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Quản lý định danh KYC')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('kyc')}"></aside>

            <section class="ds-section">
                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Quản lý yêu cầu định danh</h1>
                        <p class="ds-page-subtitle">Danh sách hồ sơ KYC chờ phê duyệt hoặc đã xử lý.</p>
                    </div>
                </div>

                <div class="staff-stat-grid">
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Tổng hồ sơ</p>
                        <p class="staff-stat-card__value"  th:text="${totalKyc}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Chờ duyệt</p>
                        <p class="staff-stat-card__value" th:text="${pendingKyc}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Đã duyệt</p>
                        <p class="staff-stat-card__value" th:text="${approvedKyc}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Từ chối</p>
                        <p class="staff-stat-card__value" th:text="${rejectedKyc}"></p>
                    </div>
                </div>

                <div class="ds-card">
                    <form th:action="@{/staff/kyc}" method="get">
                    <div class="ds-filter-panel">
                        <h2 class="ds-card-title">Bộ lọc KYC</h2>
                        <div class="ds-filter-grid">
<!--                            <input class="ds-input" type="search" placeholder="Tìm tên, email, mã hồ sơ...">-->
                            <input
                                    class="ds-input"
                                    type="search"
                                    name="keyword"
                                    th:value="${keyword}"
                                    placeholder="Tìm tên hoặc mã hồ sơ">

<!--                            <select class="ds-input">-->
<!--                                <option value="">Trạng thái</option>-->
<!--                                <option>Chờ duyệt</option>-->
<!--                                <option>Đã duyệt</option>-->
<!--                                <option>Từ chối</option>-->
<!--                            </select>-->
<!--                            <select class="ds-input">-->
<!--                                <option value="">Loại giấy tờ</option>-->
<!--                                <option>CCCD</option>-->
<!--                                <option>Hộ chiếu</option>-->
<!--                            </select>-->
                            <select class="ds-input"
                                    name="status">
                                <option value="">
                                    Trạng thái
                                </option>
                                <option
                                        th:each="s:${statuses}"
                                        th:value="${s}"
                                        th:text="${s}"
                                        th:selected="${s==selectedStatus}">
                                </option>
                            </select>

                            <select class="ds-input"
                                    name="typeKyc">
                                <option value="">
                                    Loại giấy tờ
                                </option>
                                <option
                                        th:each="t:${types}"
                                        th:value="${t}"
                                        th:text="${t}"
                                        th:selected="${t==selectedTypeKyc}">
                                </option>
                            </select>

                        </div>
                        <div class="ds-filter-actions">
                            <button
                                    type="button"
                                    onclick="window.location='/staff/kyc'"
                                    class="ds-btn ds-btn-secondary">
                                Làm mới
                            </button>
                            <button class="ds-btn ds-btn-primary" type="submit">Tìm kiếm</button>
                        </div>
                    </div>
                    </form>
                </div>

                <div class="ds-card">
                    <div class="ds-table-wrap">
                        <table class="ds-table">
                            <thead>
                            <tr>
                                <th>Mã hồ sơ</th>
                                <th>Người dùng</th>
                                <th>Loại giấy tờ</th>
                                <th class="ds-table-center">Trạng thái</th>
                                <th>Ngày gửi</th>
                                <th class="ds-table-center">Thao tác</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="k : ${kycs}">
                                <td>
                                    #KYC-
                                    <span th:text="${k.id}"></span>
                                </td>
                                <td>
                                    <div class="ds-entity">
                                            <span class="ds-avatar ds-avatar-sm">
                                                   K
                                            </span>
                                        <div>
                                            <div class="ds-entity-title"
                                                 th:text="${k.fullName}">
                                            </div>
                                            <div class="ds-entity-subtitle"
                                                 th:text="${k.citizenId}">
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td th:text="${k.getTypeKyc()}">></td>
                                <td class="ds-table-center">
                                     <span class="ds-badge"
                                            th:text="${k.status}">
                                     </span>
                                </td>
                                <td th:text="${#temporals.format(k.createdAt,'dd/MM/yyyy')}">
                                </td>
                                <td class="ds-table-center">
                                    <a class="ds-btn ds-btn-outline"
                                       th:href="@{/staff/kyc/detail(id=${k.id})}">
                                        Xem hồ sơ
                                    </a>
                                </td>
                            </tr>
                            </tbody>

                        </table>
                    </div>
                    <div class="pagination">

                        <!-- lùi -->
                        <a
                                th:if="${currentPage > 0}"
                                th:href="@{/staff/kyc(
                page=${currentPage - 1},
                keyword=${keyword},
                status=${selectedStatus},
                typeKyc=${selectedTypeKyc}
            )}">
                            ‹
                        </a>


                        <span>
        Trang
        <span th:text="${currentPage + 1}">
        </span>

        /

        <span th:text="${totalPages}">
        </span>
    </span>



                        <!-- tiến -->
                        <a
                                th:if="${currentPage + 1 < totalPages}"
                                th:href="@{/staff/kyc(
                page=${currentPage + 1},
                keyword=${keyword},
                status=${selectedStatus},
                typeKyc=${selectedTypeKyc}
            )}">
                            ›
                        </a>

                    </div>

                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/staff-ui.js}"></script>
</body>
</html>
