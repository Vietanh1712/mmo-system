<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Quản lý Ticket Hỗ Trợ')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('support-tickets')}"></aside>

            <section class="ds-section">
                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Quản lý Ticket Hỗ Trợ</h1>
                        <p class="ds-page-subtitle">Xử lý thắc mắc, lỗi nạp tiền, lỗi tài khoản và góp ý từ người dùng.</p>
                    </div>
                </div>

                <div class="staff-stat-grid">
                    <div class="ds-card staff-stat-card blue">
                        <p class="staff-stat-card__label">Tổng số ticket</p>
                        <p class="staff-stat-card__value" id="stat-total">0</p>
                    </div>
                    <div class="ds-card staff-stat-card yellow">
                        <p class="staff-stat-card__label">Chờ xử lý (Mới)</p>
                        <p class="staff-stat-card__value" id="stat-new" style="color: #b45309;">0</p>
                    </div>
                    <div class="ds-card staff-stat-card blue">
                        <p class="staff-stat-card__label">Đang xử lý</p>
                        <p class="staff-stat-card__value" id="stat-processing" style="color: #0369a1;">0</p>
                    </div>
                    <div class="ds-card staff-stat-card green">
                        <p class="staff-stat-card__label">Đã giải quyết/Đóng</p>
                        <p class="staff-stat-card__value" id="stat-resolved" style="color: #15803d;">0</p>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-filter-panel">
                        <h2 class="ds-card-title">Bộ lọc ticket</h2>
                        <div class="ds-filter-grid">
                            <input class="ds-input" type="search" id="staff-search-input" placeholder="Tìm ID, email, tiêu đề...">
                            <select class="ds-input" id="staff-status-select">
                                <option value="">Tất cả trạng thái</option>
                                <option value="Open">Mới (Open)</option>
                                <option value="Processing">Đang xử lý</option>
                                <option value="Resolved">Đã giải quyết</option>
                                <option value="Closed">Đã đóng</option>
                            </select>
                            <select class="ds-input" id="staff-category-select">
                                <option value="">Tất cả danh mục</option>
                                <option value="Lỗi nạp tiền">Lỗi nạp tiền</option>
                                <option value="Lỗi tài khoản">Lỗi tài khoản</option>
                                <option value="Góp ý">Góp ý</option>
                                <option value="Khác">Khác</option>
                            </select>
                        </div>
                        <div class="ds-filter-actions">
                            <button class="ds-btn ds-btn-secondary" type="button" onclick="resetStaffFilters()">Làm mới bộ lọc</button>
                            <button class="ds-btn ds-btn-primary" type="button" onclick="applyStaffFilters()">Tìm kiếm</button>
                        </div>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-table-wrap">
                        <table class="ds-table">
                            <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Người gửi</th>
                                <th>Danh mục</th>
                                <th>Tiêu đề</th>
                                <th class="ds-table-center">Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th class="ds-table-center">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody id="staff-tickets-body">
                            <tr>
                                <td colspan="7" style="text-align: center; padding: 24px; color: var(--ds-text-subtle);">
                                    Đang tải danh sách ticket...
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/staff-ui.js}"></script>
<script th:src="@{/js/staff-support-tickets.js}"></script>
</body>
</html>
