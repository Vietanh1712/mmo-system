<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Quản lý khiếu nại')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('complaints')}"></aside>

            <section class="ds-section">
                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Quản lý khiếu nại</h1>
                        <p class="ds-page-subtitle">Theo dõi, lọc và chuyển sang trang xử lý chi tiết từng khiếu nại.</p>
                    </div>
                </div>

                <div class="staff-stat-grid">
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Tổng khiếu nại</p>
                        <p class="staff-stat-card__value"  th:text="${totalComplaints}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Đang xử lý</p>
                        <p class="staff-stat-card__value" th:text="${inProgressComplaints}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Đã giải quyết</p>
                        <p class="staff-stat-card__value" th:text="${resolvedComplaints}"></p>
                    </div>
                    <div class="ds-card staff-stat-card">
                        <p class="staff-stat-card__label">Từ chối</p>
                        <p class="staff-stat-card__value" th:text="${refusedComplaints}"></p>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-filter-panel">
                        <h2 class="ds-card-title">Bộ lọc khiếu nại</h2>
                        <div class="ds-filter-grid">


                            <form method="get"
                                  th:action="@{/staff/complaints}"
                                  class="ds-filter-row">

                                <input
                                        class="ds-input"
                                        type="text"
                                        name="keyword"
                                        placeholder="Tìm kiếm khiếu nại..."
                                        th:value="${keyword}">

                                <select
                                        class="ds-input"
                                        name="status">

                                    <option value="ALL">
                                        Tất cả trạng thái
                                    </option>

                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s}">
                                    </option>

                                </select>

                                <button class="ds-btn ds-btn-secondary"
                                        type="button"
                                        onclick="window.location='/staff/complaints'">
                                    Làm mới
                                </button>

                                <button class="ds-btn ds-btn-primary"
                                        type="submit">
                                    Tìm kiếm
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-table-wrap">
                        <table class="ds-table">
                            <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Người gửi</th>
                                <th>Đối tượng</th>
<!--                                <th>Loại</th>-->
                                <th class="ds-table-center">Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th class="ds-table-center">Thao tác</th>
                            </tr>
                            </thead>

                            <tbody>

                            <tr th:each="complaint : ${complaints}">

                                <td th:text="'#CMP-' + ${complaint.id}"></td>

                                <td>
                                    <div class="ds-entity">

                                        <div>
                                            <div class="ds-entity-title"
                                                 th:text="${complaint.customerName}">
                                            </div>

                                            <div class="ds-entity-subtitle"
                                                 th:text="${complaint.customerEmail}">
                                            </div>
                                        </div>

                                    </div>
                                </td>

                                <td th:text="${complaint.sellerName}"></td>

<!--                                <td>Khiếu nại</td>-->

                                <td class="ds-table-center">
                                    <span th:text="${complaint.status}"></span>
                                </td>

                                <td th:text="${#temporals.format(
                                 complaint.createdAt,
                                  'dd/MM/yyyy')}">
                                </td>

                                <td class="ds-table-center">
                                    <a th:href="@{/staff/complaints/detail(id=${complaint.id})}">
                                        Xem
                                    </a>
                                </td>

                            </tr>

                            </tbody>


                        </table>
                    </div>
                    <div class="pagination">
                        <a th:if="${currentPage > 0}"
                           th:href="@{/staff/complaints(
                           page=${currentPage - 1},
                           keyword=${keyword},
                            status=${selectedStatus})}">
                            ‹
                        </a>
                        <span>
        Trang
        <span th:text="${currentPage + 1}"></span>
        /
        <span th:text="${totalPages}"></span>
    </span>
                        <a th:if="${currentPage + 1 < totalPages}"
                           th:href="@{/staff/complaints(
                            page=${currentPage + 1},
                            keyword=${keyword},
                             status=${selectedStatus})}">
                            ›
                        </a>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/staff-ui.js}"></script>
</body>
</html>
