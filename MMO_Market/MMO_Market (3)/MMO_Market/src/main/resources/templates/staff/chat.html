<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Chat người dùng')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('chat')}"></aside>

            <section class="ds-section">
                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Chat với người dùng</h1>
                        <p class="ds-page-subtitle">Hỗ trợ trực tiếp khách hàng và seller qua hội thoại.</p>
                    </div>
                    <span id="unreadConversationsBadge" class="ds-badge ds-badge-info" style="display: none;">0 hội thoại chưa đọc</span>
                </div>

                <div class="staff-chat-layout">
                    <div class="ds-card staff-chat-list">
                        <div class="staff-chat-list__header">
                            <input class="ds-input" type="search" placeholder="Tìm người dùng...">
                        </div>
                        <div class="staff-chat-list__items">
                            <!-- Dynamic content loaded by JS -->
                        </div>
                    </div>

                    <div class="ds-card staff-chat-panel">
                        <div class="staff-chat-panel__header ds-cluster-between">
                            <div class="ds-entity">
                                <span class="ds-avatar ds-avatar-sm ds-avatar-primary"></span>
                                <div>
                                    <div class="ds-entity-title">Chọn người dùng</div>
                                    <div class="ds-entity-subtitle">Bắt đầu hội thoại</div>
                                </div>
                            </div>
                            <!-- <a class="ds-btn ds-btn-outline" href="/staff/complaints/detail">Mở khiếu nại</a> -->
                        </div>

                        <div class="staff-chat-messages" id="staffChatMessages">
                            <!-- Dynamic content loaded by JS -->
                        </div>

                        <form class="staff-chat-compose" id="staffChatForm">
                            <input class="ds-input" id="staffChatInput" type="text" placeholder="Nhập tin nhắn..." autocomplete="off">
                            <button class="ds-btn ds-btn-primary" type="submit">Gửi</button>
                        </form>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/staff-ui.js}"></script>
<script th:src="@{/js/staff-chat.js}"></script>
</body>
</html>
