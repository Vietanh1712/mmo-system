<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa sản phẩm - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
    <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
    <style>
        .product-image-uploader {
            position: relative;
            width: 240px;
            height: 135px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px dashed #cbd5e1;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .product-image-uploader:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
        .product-image-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }
        .product-image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            opacity: 0;
            transition: all 0.3s ease;
        }
        .product-image-uploader:hover .product-image-overlay {
            opacity: 1;
        }
        .product-image-overlay i {
            font-size: 24px;
            margin-bottom: 8px;
            transform: translateY(10px);
            transition: all 0.3s ease 0.05s;
        }
        .product-image-uploader:hover .product-image-overlay i {
            transform: translateY(0);
        }
        .product-image-overlay span {
            font-size: 13px;
            font-weight: 500;
            transform: translateY(10px);
            transition: all 0.3s ease 0.1s;
        }
        .product-image-uploader:hover .product-image-overlay span {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
        <div class="admin-layout ds-two-column">
            <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('inventory')}"></aside>

            <section class="admin-workspace ds-page-shell" style="padding-right: 120px;">
                <div class="view-header">
                    <div>
                        <h2>Chỉnh sửa sản phẩm</h2>
                        <p>Sản phẩm #101 — Netflix Premium</p>
                    </div>
                    <a class="ds-btn ds-btn-outline" th:href="@{/seller/inventory}" style="text-decoration: none;">← Quảy lại kho</a>
                </div>

                <form class="profile-edit-form seller-form-panel" novalidate>
                    <div class="profile-edit-form__group">
                        <label>Ảnh sản phẩm</label>
                        <div class="product-image-uploader" onclick="document.getElementById('productImageInput').click();" title="Nhấp để thay đổi ảnh sản phẩm">
                            <img id="productImagePreview" src="https://via.placeholder.com/300x160/2563eb/ffffff?text=MMO+Market" class="product-image-preview" alt="Preview ảnh sản phẩm">
                            <div class="product-image-overlay">
                                <i class="fa fa-camera"></i>
                                <span>Thay đổi ảnh sản phẩm</span>
                            </div>
                        </div>
                        <input type="file" id="productImageInput" accept="image/png, image/jpeg, image/gif, image/webp" style="display: none;">
                    </div>
                    <div class="profile-edit-form__group">
                        <label for="productName">Tên sản phẩm</label>
                        <input id="productName" type="text" value="Tài khoản Netflix Premium">
                    </div>
                    <div class="ds-two-column" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                        <div class="profile-edit-form__group" style="margin-bottom: 0;">
                            <label for="mainCategory">Danh mục chính</label>
                            <select id="mainCategory" style="width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;">
                                <option value="">-- Chọn danh mục chính --</option>
                            </select>
                        </div>
                        <div class="profile-edit-form__group" style="margin-bottom: 0;">
                            <label for="subCategory">Danh mục phụ</label>
                            <select id="subCategory" style="width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;" disabled>
                                <option value="">-- Chọn danh mục chính trước --</option>
                            </select>
                        </div>
                    </div>
                    <div class="profile-edit-form__group">
                        <label for="description">Mô tả</label>
                        <textarea id="description" style="min-height: 100px; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical;"></textarea>
                    </div>
                    <div class="profile-edit-form__group">
                        <label for="userGuide">Hướng dẫn sử dụng sản phẩm</label>
                        <textarea id="userGuide" style="min-height: 100px; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; resize: vertical;"></textarea>
                    </div>

                    <div class="profile-actions">
                        <button class="profile-button profile-button--primary" type="button" disabled>Lưu sản phẩm</button>
                    </div>
                </form>

                <div class="admin-card">
                    <div class="card-header-flex ds-cluster-between">
                        <h3>Biến thể sản phẩm</h3>
                        <a class="ds-btn ds-btn-primary" th:href="@{/seller/variants/new}" style="text-decoration: none;">+ Thêm biến thể</a>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Tên biến thể</th>
                                    <th class="text-right">Giá (VNĐ)</th>
                                    <th class="text-right">Tồn kho</th>
                                    <th>Trạng thái</th>
                                    <th class="text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>1 tháng — 1 màn hình</td>
                                    <td class="text-right">89.000</td>
                                    <td class="text-right">25</td>
                                    <td><span class="ds-badge ds-badge-success">Active</span></td>
                                    <td class="text-right">
                                        <div th:replace="~{fragments/seller-actions :: variantRowActions(@{/seller/variants/edit})}"></div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>3 tháng — 1 màn hình</td>
                                    <td class="text-right">249.000</td>
                                    <td class="text-right">15</td>
                                    <td><span class="ds-badge ds-badge-success">Active</span></td>
                                    <td class="text-right">
                                        <div th:replace="~{fragments/seller-actions :: variantRowActions(@{/seller/variants/edit})}"></div>
                                    </td>
                                </tr>
                                <tr>
                                    <td>1 năm — 4K HDR</td>
                                    <td class="text-right">890.000</td>
                                    <td class="text-right">7</td>
                                    <td><span class="ds-badge ds-badge-success">Active</span></td>
                                    <td class="text-right">
                                        <div th:replace="~{fragments/seller-actions :: variantRowActions(@{/seller/variants/edit})}"></div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/customer/auth.js}"></script>
    <script th:src="@{/js/seller/seller-console.js(v=1.2)}"></script>
</body>
</html>
