<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý kho - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
    <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
    <style>
        .product-image {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .product-image.placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 20px;
        }
        .asset-badge {
            display: inline-block;
            padding: 3px 7px;
            background: var(--ds-warning-soft, #fef08a);
            color: #92400e;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 3px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--ds-border);
            padding-bottom: 12px;
        }
        .modal-header h2 { margin: 0; font-size: 16px; font-weight: 600; }
        .modal-close {
            background: none; border: none;
            font-size: 20px; cursor: pointer;
            color: var(--ds-text-muted);
            width: 32px; height: 32px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            border-radius: 6px;
        }
        .modal-close:hover { color: var(--ds-text); background: #f1f5f9; }
        .asset-detail-row {
            display: flex; gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--ds-border);
        }
        .asset-detail-row:last-child { border-bottom: none; }
        .asset-detail-label { font-weight: 600; width: 100px; flex-shrink: 0; font-size: 13px; }
        .asset-detail-value {
            flex: 1; word-break: break-all;
            color: var(--ds-text-muted);
            font-family: "Courier New", monospace;
            background: var(--ds-surface-muted);
            padding: 4px 8px; border-radius: 4px; font-size: 13px;
        }
        .asset-status {
            display: inline-block; padding: 4px 8px;
            background: #dcfce7; color: #166534;
            border-radius: 4px; font-size: 12px; font-weight: 500;
        }
        .asset-status.sold { background: #fee2e2; color: #991b1b; }
        .view-assets-btn {
            padding: 5px 10px;
            background: var(--ds-primary, #2563eb);
            color: white; border: none; border-radius: 4px;
            cursor: pointer; font-size: 12px; font-weight: 600;
            transition: all 0.2s;
        }
        .view-assets-btn:hover { background: #1d4ed8; }
        .view-assets-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .inventory-tabs {
            display: flex; gap: 4px;
            margin-bottom: 0;
            border-bottom: 1px solid var(--ds-border);
            padding: 0 24px;
        }
        .inventory-tab {
            padding: 10px 16px; border: none; background: none;
            cursor: pointer; font-weight: 600;
            color: var(--ds-text-muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            font-size: 13px;
        }
        .inventory-tab.active { color: var(--ds-primary, #2563eb); border-bottom-color: var(--ds-primary, #2563eb); }
        .inventory-tab:hover { color: var(--ds-text); }
        .empty-state { text-align: center; padding: 40px 20px; color: var(--ds-text-muted); }
        .empty-state i { font-size: 40px; margin-bottom: 12px; display: block; }
        .asset-list-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
        .asset-list-table th, .asset-list-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--ds-border); }
        .asset-list-table th { font-weight: 600; background: #f8fafc; }
    </style>
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
        <div class="admin-layout ds-two-column">
            <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('inventory')}"></aside>

            <section class="admin-workspace ds-page-shell" style="padding-right: 120px;">
                <div class="view-header">
                    <div>
                        <h2>Quản lý kho &amp; sản phẩm</h2>
                        <p>Quản lý sản phẩm, biến thể, hình ảnh và tài sản số</p>
                    </div>
                    <a class="ds-btn ds-btn-primary" th:href="@{/seller/products/new}" style="text-decoration: none;">+ Đăng bán mới</a>
                </div>

                <div class="admin-card" style="padding: 0;">
                    <!-- Filter, Search and Sort -->
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--ds-border);">
                        <div style="display: flex; gap: 12px; align-items: center; width: 100%; justify-content: space-between;">
                            <h3 style="margin: 0; font-size: 16px; font-weight: 600;">Danh sách sản phẩm</h3>
                            <div style="display: flex; gap: 12px;">
                                <!-- Ô tìm kiếm -->
                                <div style="position: relative; width: 250px;">
                                    <i class="fa fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                                    <input type="text" id="productSearch" class="ds-input" placeholder="Tìm kiếm sản phẩm..." style="padding-left: 36px; width: 100%; border-radius: 6px; border: 1px solid #cbd5e1; padding-top: 8px; padding-bottom: 8px;">
                                </div>
                                <!-- Lọc theo danh mục -->
                                <select id="productCategory" class="ds-select" style="display:none;"></select>
                                <select id="mainCategoryFilter" class="ds-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background-color: #fff; min-width: 130px;">
                                    <option value="">Tất cả danh mục chính</option>
                                </select>
                                <select id="subCategoryFilter" class="ds-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background-color: #fff; min-width: 130px;" disabled>
                                    <option value="">Tất cả danh mục phụ</option>
                                </select>
                                <!-- Sắp xếp -->
                                <select id="productSort" class="ds-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background-color: #fff; min-width: 150px;">
                                    <option value="newest">Mới nhất</option>
                                    <option value="oldest">Cũ nhất</option>
                                    <option value="stock_desc">Tồn kho: Nhiều nhất</option>
                                    <option value="stock_asc">Tồn kho: Ít nhất</option>
                                </select>
                                <!-- Nút xác nhận lọc -->
                                <button id="btnFilterProduct" class="ds-btn ds-btn-primary" style="padding: 8px 16px;">Lọc</button>
                            </div>
                        </div>
                    </div>

                    <!-- Tabs -->
                    <div class="inventory-tabs">
                        <button class="inventory-tab active" data-tab="all">Tất cả sản phẩm</button>
                        <button class="inventory-tab" data-tab="low-stock">Tồn kho thấp</button>
                        <button class="inventory-tab" data-tab="inactive">Tạm khóa</button>
                    </div>


                    <!-- Products Table -->
                    <div class="table-wrap" style="border-top: none; border-radius: 0 0 var(--ds-radius-md, 12px) var(--ds-radius-md, 12px);">
                        <table class="seller-table">
                            <thead>
                                <tr>
                                    <th style="width: 60px;"></th>
                                    <th>Sản phẩm</th>
                                    <th>Danh mục</th>
                                    <th>Loại</th>
                                    <th style="text-align: right;">Biến thể</th>
                                    <th style="text-align: right;">Tồn kho</th>
                                    <th>Trạng thái</th>
                                    <th style="text-align: right;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8" style="text-align: center; padding: 40px; color: var(--seller-muted);">
                                        <i class="fa fa-spinner fa-spin" style="font-size: 24px; display: block; margin-bottom: 8px;"></i> Đang tải danh sách sản phẩm...
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                        <!-- Empty state (hidden by default) -->
                        <div id="emptyState" class="empty-state" style="display: none;">
                            <i class="fa fa-inbox"></i>
                            <p>Bạn chưa có sản phẩm nào. Hãy tạo sản phẩm mới để bắt đầu.</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Asset Viewer Modal -->
    <div id="assetModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Chi tiết tài sản kho</h2>
                <button class="modal-close" onclick="closeAssetModal()"><i class="fa fa-times"></i></button>
            </div>
            <div id="assetModalBody">
                <!-- Asset details will be loaded here -->
            </div>
        </div>
    </div>

    <script th:src="@{/js/customer/auth.js}"></script>
    <script th:src="@{/js/seller/seller-console.js(v=1.2)}"></script>
    <script>
        // Close modal on outside click
        document.getElementById('assetModal').addEventListener('click', function(e) {
            if (e.target === this) {
                if (typeof window.closeAssetModal === 'function') {
                    window.closeAssetModal();
                } else {
                    document.getElementById('assetModal').classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
