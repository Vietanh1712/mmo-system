<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống kê Shop - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
    <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
        <div class="admin-layout ds-two-column">
            <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('statistics')}"></aside>

            <section class="admin-workspace ds-page-shell" style="padding-right: 120px;">
                <div class="view-header">
                    <div>
                        <h2>Thống kê &amp; Phân tích Shop</h2>
                        <p>Hiệu suất bán hàng 7 ngày gần nhất</p>
                    </div>
                    <span class="ds-badge ds-badge-info">Statistics</span>
                </div>

                <div class="stats-grid-4">
                    <div class="stat-card-modern green">
                        <span class="stat-card-label">Doanh thu đang giữ (Escrow)</span>
                        <div class="stat-card-value">0 ₫</div>
                        <div class="stat-card-trend">Chờ giải phóng</div>
                    </div>
                    <div class="stat-card-modern blue">
                        <span class="stat-card-label">Tổng số lượng đơn bán</span>
                        <div class="stat-card-value">0 đơn</div>
                        <div class="stat-card-trend">7 ngày gần nhất</div>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="card-header-flex">
                        <h3>Doanh thu 7 ngày gần nhất</h3>
                    </div>
                    <div style="padding: 20px 24px;">
                        <!-- Populated by JS -->
                        <div class="chart-bars">
                            <div style="margin: auto; color: var(--ds-text-muted);"><i class="fa fa-spinner fa-spin"></i> Đang tải...</div>
                        </div>
                    </div>
                </div>

                <div class="admin-card">
                    <div class="card-header-flex">
                        <h3>Top sản phẩm bán chạy</h3>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Sản phẩm</th>
                                    <th style="text-align: right;">Đã bán</th>
                                    <th style="text-align: right;">Doanh thu</th>
                                </tr>
                            </thead>
                            <tbody id="top-products-tbody">
                                <tr><td colspan="4" style="text-align:center; padding: 20px;"><i class="fa fa-spinner fa-spin"></i> Đang tải...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/customer/auth.js}"></script>
    <script th:src="@{/js/seller/seller-console.js}"></script>
</body>
</html>
