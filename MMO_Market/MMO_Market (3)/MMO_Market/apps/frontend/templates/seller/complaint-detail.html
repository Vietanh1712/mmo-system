<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phản hồi khiếu nại - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
    <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
        <div class="admin-layout ds-two-column">
            <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('complaints')}"></aside>

            <section class="admin-workspace ds-page-shell" style="padding-right: 120px;">


                <div style="display: flex; flex-direction: column; gap: 24px; max-width: 900px;">
                    <div class="ds-card">
                        <div class="ds-card-header" style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ds-border); padding-bottom: 14px;">
                            <div>
                                <h1 class="ds-card-title" id="complaintTitle">Chi tiết Khiếu nại</h1>
                                <p class="ds-caption" id="complaintSubtitle">-</p>
                            </div>
                            <span class="ds-badge" id="complaintStatusBadge">Đang tải...</span>
                        </div>
                        <div style="padding: 24px;">
                            <dl class="seller-info-grid" id="complaint-details-dl">
                                <!-- Populated by JS -->
                            </dl>

                        </div>
                    </div>

                    <div class="ds-card">
                        <div class="ds-card-header">
                            <h2 class="ds-card-title">Mô tả khiếu nại & Bằng chứng</h2>
                        </div>
                        <div style="padding: 24px; display: flex; flex-direction: column; gap: 16px;">
                            <div>
                                <strong style="font-size: 13px; color: #64748b; display: block; margin-bottom: 6px;">Phương án mong muốn của khách hàng:</strong>
                                <div style="background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 14px; font-size: 13.5px; line-height: 1.5; color: #1e3a8a; font-weight: 600;" id="c-preferred-solution">
                                    -
                                </div>
                            </div>
                            <div>
                                <strong style="font-size: 13px; color: #64748b; display: block; margin-bottom: 6px;">Chi tiết lý do khiếu nại:</strong>
                                <div style="background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 14px; font-size: 13.5px; line-height: 1.5; color: #1e293b;" id="c-description">
                                    -
                                </div>
                            </div>
                            <div id="c-evidence-section" hidden>
                                <strong style="font-size: 13px; color: #64748b; display: block; margin-bottom: 6px;">Hình ảnh/Tệp chứng cứ:</strong>
                                <img src="" style="max-width: 100%; border-radius: 8px; border: 1px solid var(--ds-border); max-height: 240px; object-fit: contain;" id="c-evidence-img" alt="Bằng chứng khiếu nại" />
                            </div>
                        </div>
                    </div>

                    <div class="ds-card" id="staffResolutionCard" hidden style="border-left: 4px solid var(--ds-primary);">
                        <div class="ds-card-header">
                            <h2 class="ds-card-title" style="color: var(--ds-primary);">Phán quyết của Staff Ban quản trị</h2>
                        </div>
                        <div style="padding: 24px;">
                            <div style="background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; padding: 14px; font-size: 13.5px; line-height: 1.5; color: #166534;" id="c-resolution">
                                -
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/customer/auth.js}"></script>
    <script th:src="@{/js/seller/seller-console.js(v=1.2)}"></script>
</body>
</html>
