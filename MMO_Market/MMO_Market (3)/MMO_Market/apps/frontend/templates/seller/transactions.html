<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử bán hàng - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
    <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
</head>
<body>
    <header th:replace="fragments/header :: header"></header>

    <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
        <div class="admin-layout ds-two-column">
            <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('transactions')}"></aside>

            <section class="admin-workspace ds-page-shell" style="padding-right: 120px;">
                <div class="view-header">
                    <div>
                        <h2>Lịch sử bán hàng</h2>
                        <p>Giao dịch escrow 3 ngày — Chờ xử lý / Tạm giữ / Hoàn tất</p>
                    </div>
                    <span class="ds-badge ds-badge-info">Giao dịch</span>
                </div>

                <div class="admin-card">
                    <div class="card-header-flex" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                        <h3>Danh sách giao dịch</h3>
                        <div style="display: flex; gap: 12px; align-items: center;">
                            <!-- Ô tìm kiếm -->
                            <div style="position: relative; width: 250px;">
                                <i class="fa fa-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #64748b;"></i>
                                <input type="text" id="transactionSearch" class="ds-input" placeholder="Tìm kiếm giao dịch..." style="padding-left: 36px; width: 100%; border-radius: 6px; border: 1px solid #cbd5e1; padding-top: 8px; padding-bottom: 8px;">
                            </div>
                            <!-- Lọc theo trạng thái đơn hàng -->
                            <select id="transactionStatus" class="ds-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background-color: #fff; min-width: 150px;">
                                <option value="">Tất cả trạng thái</option>
                                <option value="pending">Chờ xử lý</option>
                                <option value="held">Tạm giữ</option>
                                <option value="completed">Hoàn thành</option>
                                <option value="complaint">Khiếu nại</option>
                            </select>
                            <!-- Sắp xếp -->
                            <select id="transactionSort" class="ds-select" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background-color: #fff; min-width: 150px;">
                                <option value="newest">Mới nhất</option>
                                <option value="oldest">Cũ nhất</option>
                                <option value="highest_amount">Số tiền: Cao đến thấp</option>
                                <option value="lowest_amount">Số tiền: Thấp đến cao</option>
                            </select>
                            <!-- Nút xác nhận lọc -->
                            <button id="btnFilterTransaction" class="ds-btn ds-btn-primary" style="padding: 8px 16px;">Lọc</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table class="seller-table">
                            <thead>
                                <tr>
                                    <th>Mã GD</th>
                                    <th>Sản phẩm / Biến thể</th>
                                    <th>Khách hàng</th>
                                    <th style="text-align: right;">Số tiền</th>
                                    <th style="text-align: right;">Hoa hồng</th>
                                    <th>Trạng thái</th>
                                    <th>Ngày bán</th>
                                    <th style="text-align: right;">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8" style="text-align: center; padding: 40px; color: var(--seller-muted);">
                                        <i class="fa fa-spinner fa-spin" style="font-size: 24px; display: block; margin-bottom: 8px;"></i> Đang tải lịch sử giao dịch...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script th:src="@{/js/customer/auth.js}"></script>
    <script th:src="@{/js/seller/seller-console.js(v=1.2)}"></script>
</body>
</html>
