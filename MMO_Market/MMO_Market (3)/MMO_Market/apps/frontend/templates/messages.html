<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - MMO Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" th:href="@{/css/features/home.css}">
    <link rel="stylesheet" th:href="@{/css/features/messages.css}">
    <th:block th:if="${isSellerView == true}">
        <link rel="stylesheet" th:href="@{/css/customer/profile.css}">
        <th:block th:replace="~{fragments/design-system-styles :: designSystemStyles}"></th:block>
        <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
        <link rel="stylesheet" th:href="@{/css/seller/seller.css}">
    </th:block>
</head>

<body class="messages-page">

    <header th:replace="fragments/header :: header"></header>

    <th:block th:if="${isSellerView == true}">
        <main class="ds-container-fluid admin-shell" style="max-width: 1500px; margin: 0 auto;">
            <div class="admin-layout ds-two-column">
                <aside th:replace="~{fragments/seller-sidebar :: sellerSidebar('messages')}"></aside>
                <section class="admin-workspace ds-page-shell" style="padding-right: 20px;">
                    <th:block th:replace="~{this :: chatInterface}"></th:block>
                </section>
            </div>
        </main>
    </th:block>

    <th:block th:unless="${isSellerView == true}">
        <th:block th:replace="~{this :: chatInterface}"></th:block>
    </th:block>

    <template style="display:none;">
    <th:block th:fragment="chatInterface">
    <div class="messages-layout" th:style="${isSellerView == true ? 'margin: 0; max-width: 100%; height: calc(100vh - 120px); min-height: 500px; padding: 0;' : ''}">

        <!-- Sidebar -->
        <aside class="messages-sidebar" aria-label="Danh sách tin nhắn">
            <div class="messages-sidebar__header">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                    <h2 class="messages-sidebar__title" style="margin: 0;">Messages</h2>
                    <span id="messages-unread-badge" style="display: none; background: #f97316; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; white-space: nowrap;"></span>
                </div>
                <div class="messages-sidebar__search">
                    <i class="fa fa-search"></i>
                    <input type="search" id="chat-list-search" placeholder="Tìm cuộc trò chuyện..." oninput="filterChatList(this.value)">
                </div>
            </div>
            <ul class="messages-chat-list" id="messages-chat-list">
            </ul>

        </aside>

        <!-- Main chat -->
        <section class="messages-main" aria-label="Cửa sổ chat">
            <header class="messages-main__header">
                <div class="messages-main__header-left" id="chat-header-info" style="cursor: pointer;" onclick="goToCurrentShop()" title="Xem gian hàng">
                    <div class="messages-main__header-avatar" id="chat-header-avatar"></div>
                    <div>
                        <p class="messages-main__shop-name" id="chat-header-name"></p>
                        <p class="messages-main__online" id="chat-header-status"></p>
                    </div>
                </div>
                <div class="messages-main__header-actions" style="position: relative; display: flex; align-items: center; gap: 8px;">
                    <a href="#" id="view-complaint-btn" class="messages-main__header-link-btn" style="display: none;" target="_blank"></a>
                    <button type="button" class="messages-main__action-btn" title="Tùy chọn" onclick="toggleDropdown(event)"><i class="fa fa-ellipsis-v"></i></button>
                    <div id="chat-dropdown" class="chat-dropdown" style="display: none;">
                        <a href="#" onclick="clearHistory(event)"><i class="fa fa-trash"></i> Xóa lịch sử chat</a>
                        <a href="#" onclick="toggleSearchMessages(event)"><i class="fa fa-search"></i> Tìm tin nhắn</a>
                    </div>
                </div>
            </header>

            <!-- Inline Search Bar inside current conversation -->
            <div id="message-search-container" style="display: none; padding: 10px 16px; background: #f1f5f9; border-bottom: 1px solid var(--border-color); align-items: center; gap: 8px;">
                <i class="fa fa-search" style="color: #64748b; font-size: 14px;"></i>
                <input type="text" id="message-search-input" placeholder="Tìm tin nhắn trong cuộc trò chuyện..." style="flex: 1; border: none; background: transparent; outline: none; font-size: 13.5px; font-family: inherit;" oninput="performMessageSearch(this.value)">
                <button type="button" onclick="closeMessageSearch()" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; padding: 4px; display: inline-flex;" title="Đóng tìm kiếm">
                    <i class="fa fa-times"></i>
                </button>
            </div>

            <div class="messages-main__body" id="messages-main-body">
                <div class="messages-empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8; text-align: center; padding: 40px 20px;">
                    <i class="fa fa-comments-o" style="font-size: 48px; margin-bottom: 12px; color: #cbd5e1;"></i>
                    <p style="margin: 0; font-size: 14px; font-weight: 600; color: #64748b;">Chưa có cuộc trò chuyện nào được chọn</p>
                    <p style="margin: 6px 0 0; font-size: 12.5px; color: #94a3b8;">Hãy chọn một cuộc trò chuyện từ danh sách bên trái hoặc nhắn tin cho người bán từ trang sản phẩm.</p>
                </div>
            </div>

            <footer class="messages-main__footer">
                <!-- Attachment preview box -->
                <div id="attachment-preview-container" style="display: none; padding: 8px 12px; background: #f8fafc; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; align-items: center; gap: 10px; position: relative;">
                    <div id="attachment-preview-content" style="flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0;"></div>
                    <button type="button" onclick="cancelAttachment()" style="background: none; border: none; color: #ef4444; cursor: pointer; padding: 4px;" title="Xóa đính kèm">
                        <i class="fa fa-times" style="font-size: 16px;"></i>
                    </button>
                </div>

                <div class="messages-input-row">
                    <button type="button" class="messages-input-row__attach" title="Đính kèm tệp" onclick="document.getElementById('chat-file-input').click()"><i class="fa fa-plus"></i></button>
                    <div class="messages-input-row__field">
                        <input type="text" id="message-input" placeholder="Nhập tin nhắn..." autocomplete="off"
                            onkeypress="if(event.key==='Enter'){event.preventDefault();sendMessage();}">
                        <i class="fa fa-smile-o messages-input-row__emoji" title="Emoji"></i>
                    </div>
                    <button type="button" class="messages-input-row__send" onclick="sendMessage()" title="Gửi">
                        <i class="fa fa-paper-plane"></i>
                    </button>
                </div>
                <div class="messages-input-sub">
                    <a href="#" onclick="event.preventDefault(); document.getElementById('chat-image-input').click();"><i class="fa fa-image"></i> Send Image</a>
                    <a href="#" onclick="event.preventDefault(); document.getElementById('chat-file-input').click();"><i class="fa fa-paperclip"></i> Attach Files</a>
                    <input type="file" id="chat-image-input" accept="image/*" style="display: none;" onchange="handleChatImageUpload(event)">
                    <input type="file" id="chat-file-input" accept="*/*" style="display: none;" onchange="handleChatFileUpload(event)">
                </div>
            </footer>
        </section>

    </div>
    </th:block>
    </template>

    <footer th:replace="fragments/footer :: footer"></footer>

    <script th:src="@{/js/customer/auth.js}"></script>
    <script>
        const CHAT_DATA = {};

        const MESSAGES_HISTORY = {};

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function getInitials(name) {
            if (!name || !name.trim()) return '?';
            return name.trim().charAt(0).toUpperCase();
        }

        function getSenderAvatarHtml(senderName, role) {
            let initials = getInitials(senderName);
            let bg = '#0f172a'; // Match header avatar background color exactly
            let titleRole = role || 'Khách hàng';
            let iconHtml = escapeHtml(initials);

            if (role) {
                if (role.includes('Cửa hàng') || role.includes('Seller') || role.includes('Shop')) {
                    titleRole = 'Cửa hàng';
                } else if (role.includes('Khách hàng') || role.includes('Customer') || role.includes('Buyer')) {
                    titleRole = 'Khách hàng';
                } else if (role.includes('Staff') || role.includes('Admin') || role.includes('Nhân viên')) {
                    titleRole = 'Nhân viên';
                    iconHtml = '<i class="fa fa-user-shield" style="font-size: 11px;"></i>';
                }
            }

            return `<div style="width: 32px; height: 32px; border-radius: 50%; background: ${bg}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; align-self: flex-start; margin-top: 2px;" title="${escapeHtml(senderName || '')} (${titleRole})">${iconHtml}</div>`;
        }

        let currentSelectedChatId = null;
        let pendingAttachment = null;
        let activeChatList = []; // list from backend
        let chatPollInterval = null;
        let chatSocket = null;
        let wsReconnectTimeout = null;
        let urlContextProduct = null;
        let currentContextProduct = null; // active product context for current chat (set by URL or API)

        // Initialize chat page
        async function initChats() {
            const token = sessionStorage.getItem('accessToken');
            if (!token) {
                window.location.href = '/login';
                return;
            }

            // Load context product if productId query parameter exists
            const urlParams = new URLSearchParams(window.location.search);
            const sellerIdParam = urlParams.get('sellerId');
            const userString = sessionStorage.getItem("userInfo") || sessionStorage.getItem("user");
            if (userString && sellerIdParam) {
                try {
                    const user = JSON.parse(userString);
                    if (user && Number(user.id) === Number(sellerIdParam)) {
                        sessionStorage.setItem('pendingToast', JSON.stringify({
                            type: 'warning',
                            message: 'Bạn không thể nhắn tin cho chính mình.'
                        }));
                        window.location.href = '/messages';
                        return;
                    }
                } catch(e){}
            }

            // Check if there is a pending toast to display
            const pending = sessionStorage.getItem('pendingToast');
            if (pending) {
                try {
                    const toastInfo = JSON.parse(pending);
                    if (toastInfo.type === 'warning' && typeof showWarningToast === 'function') {
                        showWarningToast(toastInfo.message);
                    }
                } catch(e){}
                sessionStorage.removeItem('pendingToast');
            }

            const productIdParam = urlParams.get('productId');
            if (productIdParam) {
                try {
                    const prodRes = await fetch(`/api/search/products/${productIdParam}`);
                    if (prodRes.ok) {
                        const prod = await prodRes.json();
                        urlContextProduct = {
                            id: prod.id || productIdParam,
                            name: prod.name,
                            price: prod.price,
                            sellerId: prod.sellerId,
                            stock: prod.stock !== undefined ? prod.stock : 0
                        };
                    }
                } catch (err) {
                    console.error('Cannot load context product details:', err);
                }
            }

            try {
                const res = await authFetch('/v1/chats');
                if (res.ok) {
                    activeChatList = await res.json();
                }
            } catch (err) {
                console.error('Cannot load chat contacts from backend:', err);
            }

            renderSidebarChats();
            selectInitialChat();
            startChatPolling();
        }

        function renderSidebarChats() {
            const listContainer = document.getElementById('messages-chat-list');
            if (!listContainer) return;
            listContainer.innerHTML = '';

            let totalUnread = 0;

            // Render contacts from DB
            if (activeChatList.length === 0) {
                listContainer.innerHTML = '<li style="padding: 16px; text-align: center; color: #94a3b8; font-size: 13px;">Chưa có cuộc trò chuyện nào.</li>';
            } else {
                activeChatList.forEach(c => {
                    const isActive = c.contactId === currentSelectedChatId;
                    const timeStr = c.latestTime ? formatChatTime(new Date(c.latestTime)) : '';
                    const unread = c.unreadCount || 0;
                    if (unread > 0) totalUnread++;

                    const badgeHtml = (unread > 0 && !isActive)
                        ? `<span class="messages-chat-item__badge">${unread}</span>`
                        : '';

                    const isDispute = c.isComplaint || c.contactId < 0;
                    const avatarContent = isDispute ? '<i class="fa fa-gavel" style="font-size:15px;"></i>' : getInitials(c.name);

                    const li = document.createElement('li');
                    li.className = `messages-chat-item ${isActive ? 'is-active' : ''} ${(unread > 0 && !isActive) ? 'has-unread' : ''}`;
                    li.setAttribute('data-chat-id', c.contactId);
                    li.onclick = () => selectChat(c.contactId);
                    li.innerHTML = `
                        <div class="messages-chat-item__avatar-wrap">
                            <div class="messages-chat-item__avatar ${isDispute ? 'messages-chat-item__avatar--dispute' : ''}" style="background: #0f172a; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;">${avatarContent}</div>
                            <span class="messages-chat-item__status ${c.online ? '' : 'messages-chat-item__status--offline'}"></span>
                        </div>
                        <div class="messages-chat-item__body">
                            <div class="messages-chat-item__top">
                                <span class="messages-chat-item__name ${unread > 0 && !isActive ? 'font-bold' : ''}">${c.name}</span>
                                <span class="messages-chat-item__time">${timeStr}</span>
                            </div>
                            <div class="messages-chat-item__preview">
                                <span>${c.latestMessage || ''}</span>
                                ${badgeHtml}
                            </div>
                        </div>
                    `;
                    listContainer.appendChild(li);
                });
            }

            // Update total unread conversations badge
            const totalBadge = document.getElementById('messages-unread-badge');
            if (totalBadge) {
                if (totalUnread > 0) {
                    totalBadge.textContent = `${totalUnread} hội thoại chưa đọc`;
                    totalBadge.style.display = 'inline-flex';
                } else {
                    totalBadge.style.display = 'none';
                }
            }
        }

        async function selectInitialChat() {
            const urlParams = new URLSearchParams(window.location.search);
            const sellerIdParam = urlParams.get('sellerId');
            if (sellerIdParam && !isNaN(Number(sellerIdParam))) {
                await selectChat(Number(sellerIdParam));
            } else if (activeChatList && activeChatList.length > 0) {
                await selectChat(activeChatList[0].contactId);
            } else {
                const headerName = document.getElementById('chat-header-name');
                if (headerName) headerName.textContent = '';
                const headerAvatar = document.getElementById('chat-header-avatar');
                if (headerAvatar) headerAvatar.textContent = '';
                const headerStatus = document.getElementById('chat-header-status');
                if (headerStatus) headerStatus.textContent = '';
            }
        }

        async function selectChat(id) {
            currentSelectedChatId = id;
            document.querySelectorAll('.messages-chat-item').forEach(el => {
                const itemId = parseInt(el.getAttribute('data-chat-id'));
                el.classList.toggle('is-active', itemId === id);
            });

            let chat = activeChatList.find(c => c.contactId === id);
            if (!chat) {
                const mockKey = Object.keys(CHAT_DATA).find(k => 
                    CHAT_DATA[k].sellerId === id || (CHAT_DATA[k].sellerId === null && id === 14)
                );
                if (mockKey) {
                    const mock = CHAT_DATA[mockKey];
                    chat = {
                        contactId: id,
                        name: mock.name,
                        avatar: mock.avatar,
                        online: mock.online,
                        product: mock.product,
                        price: mock.price,
                        isBlocked: mock.isBlocked,
                        isMuted: mock.isMuted
                    };
                } else {
                    // Fetch real contact info from backend (e.g. when navigating via ?sellerId=X)
                    try {
                        const infoRes = await authFetch(`/v1/chats/contact/${id}/info`);
                        if (infoRes.ok) {
                            const info = await infoRes.json();
                            chat = {
                                contactId: id,
                                name: info.name,
                                avatar: info.avatar,
                                online: info.online,
                                isBlocked: false,
                                isMuted: false
                            };
                        } else {
                            chat = { contactId: id, name: `Người dùng #${id}`, avatar: 'US', online: false, isBlocked: false, isMuted: false };
                        }
                    } catch (err) {
                        chat = { contactId: id, name: `Người dùng #${id}`, avatar: 'US', online: false, isBlocked: false, isMuted: false };
                    }
                }
            }

            document.getElementById('chat-header-name').textContent = chat.name;
            const headerInfoEl = document.getElementById('chat-header-info');
            if (chat.isComplaint || id < 0) {
                document.getElementById('chat-header-avatar').innerHTML = '<i class="fa fa-gavel" style="font-size:16px;"></i>';
                document.getElementById('chat-header-avatar').style.background = '#0f172a';
                document.getElementById('chat-header-avatar').style.color = '#ffffff';
                if (headerInfoEl) {
                    headerInfoEl.style.cursor = 'default';
                    headerInfoEl.removeAttribute('title');
                }
            } else {
                document.getElementById('chat-header-avatar').textContent = getInitials(chat.name);
                document.getElementById('chat-header-avatar').style.background = '#0f172a';
                document.getElementById('chat-header-avatar').style.color = '#ffffff';
                if (headerInfoEl) {
                    headerInfoEl.style.cursor = 'pointer';
                    headerInfoEl.setAttribute('title', 'Xem gian hàng');
                }
            }
            const contextProductNameEl = document.getElementById('context-product-name');
            if (contextProductNameEl) {
                contextProductNameEl.textContent = chat.product || 'Tin nhắn trực tuyến';
            }
            const contextProductPriceEl = document.getElementById('context-product-price');
            if (contextProductPriceEl) {
                contextProductPriceEl.textContent = chat.price || '—';
            }

            const statusEl = document.getElementById('chat-header-status');
            if (chat.online) {
                statusEl.innerHTML = '<i class="fa fa-circle"></i> Online Now';
                statusEl.style.color = '#10b981';
            } else {
                statusEl.innerHTML = '<i class="fa fa-circle"></i> Offline';
                statusEl.style.color = '#94a3b8';
            }

            // Load history
            await loadChatHistory(id);

            // Update block/mute controls UI
            updateChatUIState(chat);
            
            // Close search bar when changing contact
            closeMessageSearch();
        }

        async function loadChatHistory(id) {
            if (id !== currentSelectedChatId) return;
            try {
                const res = await authFetch(`/v1/chats/${id}`);
                if (id !== currentSelectedChatId) return;
                if (res.ok) {
                    const data = await res.json();
                    if (id !== currentSelectedChatId) return;
                    // Backend returns { messages: [...], contextProductId: N }
                    const dbMessages = Array.isArray(data) ? data : (data.messages || []);
                    const contextProductId = Array.isArray(data) ? null : data.contextProductId;
                    const isComplaint = Array.isArray(data) ? false : !!data.isComplaint;
                    const complaintId = Array.isArray(data) ? null : data.complaintId;
                    const userRole = Array.isArray(data) ? null : data.userRole;
                    const transactionId = Array.isArray(data) ? null : data.transactionId;
                    const complaintDescription = Array.isArray(data) ? null : data.complaintDescription;

                    let chat = activeChatList.find(c => c.contactId === id);
                    if (chat) {
                        chat.isComplaint = isComplaint;
                        chat.complaintId = complaintId;
                        chat.userRole = userRole;
                        chat.transactionId = transactionId;
                        chat.sellerId = data.sellerId;
                        chat.customerId = data.customerId;
                        chat.complaintDescription = complaintDescription;
                    }

                    if (isComplaint || id < 0) {
                        const headerAvatarEl = document.getElementById('chat-header-avatar');
                        if (headerAvatarEl) {
                            headerAvatarEl.style.background = '#0f172a';
                            headerAvatarEl.style.color = '#ffffff';
                            headerAvatarEl.innerHTML = '<i class="fa fa-gavel" style="font-size:16px;"></i>';
                        }
                        const headerInfoEl = document.getElementById('chat-header-info');
                        if (headerInfoEl) {
                            if (userRole === 'customer') {
                                headerInfoEl.style.cursor = 'pointer';
                                headerInfoEl.setAttribute('title', 'Xem gian hàng');
                            } else {
                                headerInfoEl.style.cursor = 'default';
                                headerInfoEl.removeAttribute('title');
                            }
                        }
                    }

                    // Determine product context for this chat:
                    // 1. From URL params (customer side: sellerId matches current contact)
                    if (urlContextProduct && urlContextProduct.sellerId === id) {
                        currentContextProduct = urlContextProduct;
                    } else if (contextProductId) {
                        // 2. From API response (seller side: load product info from DB)
                        currentContextProduct = null; // reset first
                        try {
                            const prodRes = await fetch(`/api/search/products/${contextProductId}`);
                            if (id !== currentSelectedChatId) return;
                            if (prodRes.ok) {
                                const prod = await prodRes.json();
                                if (id !== currentSelectedChatId) return;
                                currentContextProduct = {
                                    id: prod.id || contextProductId,
                                    name: prod.name,
                                    price: prod.price,
                                    sellerId: prod.sellerId,
                                    stock: prod.stock !== undefined ? prod.stock : 0
                                };
                            }
                        } catch (err) {
                            console.error('Cannot load context product from API:', err);
                        }
                    } else {
                        currentContextProduct = null; // no product context
                    }

                    if (id !== currentSelectedChatId) return;
                    renderMessages(dbMessages);
                    return;
                }
            } catch (err) {
                console.error('Cannot load messages from database:', err);
            }
            if (id !== currentSelectedChatId) return;
            // Empty state if no messages
            renderMessages([]);
        }

        function renderMessages(messages) {
            const body = document.getElementById('messages-main-body');
            if (!body) return;
            body.innerHTML = '';

            let chat = activeChatList.find(c => c.contactId === currentSelectedChatId);
            if (!chat) {
                const mockKey = Object.keys(CHAT_DATA).find(k => 
                    CHAT_DATA[k].sellerId === currentSelectedChatId || (CHAT_DATA[k].sellerId === null && currentSelectedChatId === 14)
                );
                if (mockKey) chat = CHAT_DATA[mockKey];
            }

            // 1. Add date badge
            const dateBadge = document.createElement('div');
            dateBadge.className = 'messages-date-badge';
            dateBadge.textContent = 'TODAY';
            body.appendChild(dateBadge);

            // 2. Add context product card if this conversation has a product context
            if (currentContextProduct) {
                const cp = currentContextProduct;
                const contextCard = document.createElement('article');
                contextCard.className = 'messages-context-card';
                
                const isDispute = chat && (chat.isComplaint || chat.contactId < 0);
                if (!isDispute) {
                    contextCard.onclick = () => { window.location.href = `/products/${cp.id}`; };
                    contextCard.style.cursor = 'pointer';
                } else {
                    contextCard.style.cursor = 'default';
                }

                let formattedPrice = '—';
                try {
                    formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' })
                        .format(cp.price).replace('₫', 'VNĐ');
                } catch (e) { formattedPrice = cp.price + ' VNĐ'; }

                const isOutOfStock = (cp.stock === undefined || cp.stock <= 0);
                const stockBadge = isOutOfStock
                    ? `<span class="messages-context-card__stock" style="color: #ef4444; background: #fef2f2;">HẾT HÀNG</span>`
                    : `<span class="messages-context-card__stock">CÒN HÀNG</span>`;

                const chevronHtml = !isDispute ? '<i class="fa fa-chevron-right messages-context-card__chevron"></i>' : '';

                contextCard.innerHTML = `
                    <div class="messages-context-card__thumb"><i class="fa fa-play-circle"></i></div>
                    <div class="messages-context-card__info">
                        <div class="messages-context-card__label">${isDispute ? 'SẢN PHẨM TRANH CHẤP' : 'SẢN PHẨM ĐANG HỎI'}</div>

            }
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text && !pendingAttachment) return;

            let chat = activeChatList.find(c => c.contactId === currentSelectedChatId);
            if (!chat) {
                const mockKey = Object.keys(CHAT_DATA).find(k => 
                    CHAT_DATA[k].sellerId === currentSelectedChatId || (CHAT_DATA[k].sellerId === null && currentSelectedChatId === 14)
                );
                if (mockKey) chat = CHAT_DATA[mockKey];
            }

            if (chat && chat.isBlocked) {
                showAlert('Không thể gửi tin nhắn do cuộc trò chuyện này đã bị chặn.');
                return;
            }

            let messageText = text;
            if (pendingAttachment) {
                if (pendingAttachment.type === 'image') {
                    messageText = `<img src="${pendingAttachment.dataUrl}" style="max-width: 200px; max-height: 150px; border-radius: 8px; cursor: pointer; display: block; margin-top: 5px;" onclick="window.open(this.src)" alt="Image">`;
                } else {
                    const fileSizeFormatted = pendingAttachment.size > 1024 * 1024 
                        ? (pendingAttachment.size / (1024 * 1024)).toFixed(1) + ' MB' 
                        : (pendingAttachment.size / 1024).toFixed(1) + ' KB';
                    messageText = `
                        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #f1f5f9; border-radius: 8px; border: 1px solid #cbd5e1; color: #1e293b; font-size: 13px; margin-top: 5px;">
                            <i class="fa fa-file-text-o" style="font-size: 20px; color: #64748b;"></i>
                            <div style="text-align: left; flex: 1; min-width: 0;">
                                <div style="font-weight: 600; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; max-width: 140px;" title="${pendingAttachment.name}">${pendingAttachment.name}</div>
                                <div style="font-size: 11px; color: #64748b;">${fileSizeFormatted}</div>
                            </div>
                            <a href="${pendingAttachment.url}" download="${pendingAttachment.name}" style="color: var(--brand-accent); padding: 4px; display: inline-flex;" title="Tải xuống">
                                <i class="fa fa-download" style="font-size: 16px;"></i>
                            </a>
                        </div>
                    `;
                }
            }

            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) {
                try {
                    const productIdToSend = (urlContextProduct && urlContextProduct.sellerId === currentSelectedChatId)
                        ? String(urlContextProduct.id) : undefined;
                    
                    const payload = {
                        recipientId: currentSelectedChatId,
                        content: messageText
                    };
                    if (productIdToSend) {
                        payload.productId = productIdToSend;
                    }

                    chatSocket.send(JSON.stringify(payload));
                    
                    input.value = '';
                    cancelAttachment();
                    return;
                } catch (err) {
                    console.error('Error sending message via WebSocket:', err);
                }
            }

            try {
                // Include productId when customer initiates chat from a product page
                const productIdToSend = (urlContextProduct && urlContextProduct.sellerId === currentSelectedChatId)
                    ? urlContextProduct.id : undefined;

                const res = await authFetch(`/v1/chats/${currentSelectedChatId}`, {
                    method: 'POST',
                    body: JSON.stringify({
                        message: messageText,
                        ...(productIdToSend ? { productId: productIdToSend } : {})
                    })
                });


                if (res.ok) {
                    input.value = '';
                    cancelAttachment();
                    await loadChatHistory(currentSelectedChatId);
                } else {
                    const errData = await res.json();
                    showAlert(errData.message || 'Gửi tin nhắn thất bại.');
                }
            } catch (err) {
                console.error('Error sending message:', err);
                showAlert('Không thể kết nối đến máy chủ.');
            }
        }

        function initWebSocket() {
            const token = sessionStorage.getItem('accessToken');
            if (!token) return;

            if (chatSocket && chatSocket.readyState === WebSocket.OPEN) return;

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/chat?token=${token}`;

            chatSocket = new WebSocket(wsUrl);

            chatSocket.onopen = function() {
                console.log("WebSocket connected.");
                if (wsReconnectTimeout) {
                    clearTimeout(wsReconnectTimeout);
                    wsReconnectTimeout = null;
                }
            };

            chatSocket.onmessage = async function(event) {
                try {
                    const data = JSON.parse(event.data);
                    const isForCurrentChat = (
                        (data.senderId === currentSelectedChatId || data.receiverId === currentSelectedChatId) ||
                        (data.complaintId && currentSelectedChatId === -data.complaintId)
                    );
                    
                    if (isForCurrentChat) {
                        await loadChatHistory(currentSelectedChatId);
                    }
                    
                    await refreshSidebarChatsList();
                } catch (e) {
                    console.error("Error processing websocket message:", e);
                }
            };

            chatSocket.onclose = function() {
                console.log("WebSocket disconnected. Reconnecting in 5 seconds...");
                if (!wsReconnectTimeout) {
                    wsReconnectTimeout = setTimeout(initWebSocket, 5000);
                }
            };

            chatSocket.onerror = function(err) {
                console.error("WebSocket error:", err);
            };
        }

            document.getElementById('custom-confirm-cancel').style.display = 'none';
            document.getElementById('custom-confirm-submit').textContent = 'OK';
            document.getElementById('custom-confirm-modal').style.display = 'flex';
            customConfirmCallback = callback;
        }

        function onCustomConfirmResult(result) {
            document.getElementById('custom-confirm-modal').style.display = 'none';
            if (customConfirmCallback) {
                customConfirmCallback(result);
                customConfirmCallback = null;
            }
        }

        document.addEventListener('DOMContentLoaded', initChats);
    </script>

    <!-- Custom Dialog Modal -->
    <div id="custom-confirm-modal" style="display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center;">
        <div style="background: #ffffff; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); text-align: left; font-family: sans-serif; border: 1px solid #e2e8f0;">
            <h3 id="custom-confirm-title" style="margin: 0 0 10px 0; font-size: 16px; font-weight: 700; color: #0f172a; display: flex; align-items: center; gap: 8px;">
                <i class="fa fa-info-circle" style="color: var(--brand-accent, #f97316);"></i> Confirm
            </h3>
            <p id="custom-confirm-message" style="margin: 0 0 20px 0; font-size: 13.5px; color: #475569; line-height: 1.5;"></p>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" id="custom-confirm-cancel" style="padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; border: 1px solid #e2e8f0; background: #f8fafc; color: #334155; cursor: pointer;" onclick="onCustomConfirmResult(false)">Hủy</button>
                <button type="button" id="custom-confirm-submit" style="padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: 8px; border: none; background: var(--brand-dark, #0f172a); color: #ffffff; cursor: pointer;" onclick="onCustomConfirmResult(true)">Xác nhận</button>
            </div>
        </div>
    </div>
    
</body>

</html>
