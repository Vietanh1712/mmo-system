<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Quản lý rút tiền')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('withdrawals')}"></aside>

            <section class="ds-section">
                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Quản lý yêu cầu rút tiền</h1>
                        <p class="ds-page-subtitle">Kiểm tra và xử lý các giao dịch rút tiền từ seller.</p>
                    </div>
                </div>

                <div class="staff-stat-grid">
                    <div class="ds-card staff-stat-card blue">
                        <p class="staff-stat-card__label">Tổng yêu cầu</p>
                        <p class="staff-stat-card__value" th:text="${totalWithdrawals}"></p>
                    </div>
                    <div class="ds-card staff-stat-card yellow">
                        <p class="staff-stat-card__label">Chờ duyệt</p>
                        <p class="staff-stat-card__value" th:text="${pendingWithdrawals}"></p>
                    </div>
                    <div class="ds-card staff-stat-card green">
                        <p class="staff-stat-card__label">Hoàn tất</p>
                        <p class="staff-stat-card__value" th:text="${completedWithdrawals}"></p>
                    </div>
                    <div class="ds-card staff-stat-card red">
                        <p class="staff-stat-card__label">Từ chối</p>
                        <p class="staff-stat-card__value" th:text="${rejectedWithdrawals}"></p>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-filter-panel withdrawal-filter">
                        <h2 class="ds-card-title">Bộ lọc rút tiền</h2>
                        <div class="ds-filter-grid withdrawal-filter-grid">
                            <form method="get"
                                  th:action="@{/staff/withdrawals}"
                                  class="ds-filter-row">

                                <input
                                        class="ds-input"
                                        type="text"
                                        name="keyword"
                                        placeholder="Tìm mã giao dịch, seller..."
                                        th:value="${keyword}">

                                <select
                                        class="ds-input"
                                        name="status">
                                    <option value="ALL"
                                            th:selected="${selectedStatus == null}">
                                        Tất cả trạng thái
                                    </option>
                                    <option th:each="s : ${statuses}"
                                            th:value="${s}"
                                            th:text="${s}"
                                            th:selected="${s == selectedStatus}">
                                    </option>
                                </select>
                                <input
                                        class="ds-input"
                                        type="number"
                                        name="minAmount"
                                        th:value="${minAmount}"
                                        placeholder="Số tiền tối thiểu">

                                <div class="withdrawal-filter-actions">

                                <button class="ds-btn ds-btn-secondary"
                                        type="button"
                                        onclick="window.location='/staff/withdrawals'">
                                    Làm mới
                                </button>

                                <button class="ds-btn ds-btn-primary"
                                        type="submit">
                                    Tìm kiếm
                                </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="ds-card">
                    <div class="ds-table-wrap">
                        <table class="ds-table">
                            <thead>
                            <tr>
                                <th>Mã GD</th>
                                <th>Seller</th>
                                <th>Số tiền</th>
                                <th>Ngân hàng</th>
                                <th class="ds-table-center">Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th class="ds-table-center">Thao tác</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="w : ${withdrawals}">
                                <td>
                                    #WD-
                                    <span th:text="${w.id}"></span>
                                </td>
                                <td>
                                    <div class="ds-entity">
                                        <div>
                                            <div class="ds-entity-title"
                                                 th:text="${w.seller.fullName}">
                                                Seller
                                            </div>
                                            <div class="ds-entity-subtitle"
                                                 th:text="${w.seller.email}">
                                                email
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td class="ds-money">
                                      <span
                                      th:text="${#numbers.formatDecimal(w.amountVnd,0,'COMMA',0,'POINT')}">
                                      </span>
                                    đ
                                </td>
                                <td>
                                    <span th:text="${w.bankInfo.bankName}">
                                          Bank
                                    </span>

                                </td>
                                <td class="ds-table-center">

                                    <span
                                         class="ds-badge"
                                         th:text="${w.status}">
                                      </span>
                                </td>
                                <td
                                        th:text="${w.createdAt}">
                                </td>
                                 <td class="ds-table-center">
                                     <div class="ds-table-actions">
                                         <a class="ds-icon-btn ds-icon-btn-view" th:href="@{/staff/withdrawals/detail(id=${w.id})}" title="Xem chi tiết" aria-label="Xem chi tiết">
                                             <svg class="ds-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                                 <path d="M2.25 12C3.73 8.12 7.49 5.25 12 5.25C16.51 5.25 20.27 8.12 21.75 12C20.27 15.88 16.51 18.75 12 18.75C7.49 18.75 3.73 15.88 2.25 12Z" stroke="currentColor" stroke-width="2"/>
                                                 <path d="M12 15.25C13.79 15.25 15.25 13.79 15.25 12C15.25 10.21 13.79 8.75 12 8.75C10.21 8.75 8.75 10.21 8.75 12C8.75 13.79 10.21 15.25 12 15.25Z" stroke="currentColor" stroke-width="2"/>
                                             </svg>
                                         </a>
                                     </div>
                                 </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="ds-pagination">
                        <div class="ds-pagination-pages">
                            <!-- lùi -->
                            <a th:if="${currentPage > 0}"
                               th:href="@{/staff/withdrawals(page=${currentPage - 1}, keyword=${keyword}, status=${selectedStatus}, minAmount=${minAmount})}"
                               class="ds-page-link">‹</a>
                            <span th:unless="${currentPage > 0}" class="ds-page-link ds-page-link-disabled">‹</span>

                            <!-- các trang số -->
                            <th:block th:if="${totalPages > 0}">
                                <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                                    <a th:if="${i != currentPage}"
                                       th:href="@{/staff/withdrawals(page=${i}, keyword=${keyword}, status=${selectedStatus}, minAmount=${minAmount})}"
                                       th:text="${i + 1}"
                                       class="ds-page-link">1</a>
                                    <span th:if="${i == currentPage}"
                                          th:text="${i + 1}"
                                          class="ds-page-link ds-page-link-active">1</span>
                                </th:block>
                            </th:block>
                            <th:block th:unless="${totalPages > 0}">
                                <span class="ds-page-link ds-page-link-active">1</span>
                            </th:block>

                            <!-- tiến -->
                            <a th:if="${currentPage + 1 < totalPages}"
                               th:href="@{/staff/withdrawals(page=${currentPage + 1}, keyword=${keyword}, status=${selectedStatus}, minAmount=${minAmount})}"
                               class="ds-page-link">›</a>
                            <span th:unless="${currentPage + 1 < totalPages}" class="ds-page-link ds-page-link-disabled">›</span>
                        </div>
                        <div class="ds-pagination-meta">
                            <span th:text="'Tổng số: ' + ${totalWithdrawals} + ' bản ghi'"></span>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/customer/auth.js}"></script>
<script th:src="@{/js/staff/staff-ui.js}"></script>
</body>
</html>
