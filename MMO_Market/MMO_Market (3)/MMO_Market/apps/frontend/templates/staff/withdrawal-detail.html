<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Phê duyệt rút tiền')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('withdrawals')}"></aside>

            <section class="ds-section">
                <nav class="staff-breadcrumb">
                    <a href="/staff/withdrawals">Rút tiền</a>
                    <span>/</span>
                    <span th:text="'#WD-' + ${withdrawal.id}"></span>
                </nav>

                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Phê duyệt / từ chối rút tiền</h1>
                        <p class="ds-page-subtitle"
                           th:text="'Giao dịch #WD-' + ${withdrawal.id}
                           + ' — '
                           + ${withdrawal.seller.fullName}">
                        </p>
                    </div>
                </div>

                <div class="staff-detail-grid">
                    <div class="ds-stack-md">
                        <div class="ds-card">
                            <div class="ds-card-header">
                                <h2 class="ds-card-title">Thông tin yêu cầu</h2>
                            </div>
                            <div style="padding: 20px 24px;">
                                <dl class="staff-info-list">
                                    <div class="staff-info-row">
                                        <dt>Mã giao dịch</dt>
                                        <dd th:text="'#WD-' + ${withdrawal.id}"></dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Seller</dt>
                                        <dd th:text="${withdrawal.seller.fullName}
                                         + ' — '
                                         + ${withdrawal.seller.email}">
                                        </dd>
                                    </div>
                                     <div class="staff-info-row">
                                         <dt>Trạng thái</dt>
                                         <dd>
                                             <span class="ds-badge"
                                                   th:classappend="${#strings.toLowerCase(withdrawal.status) == 'approved' ? 'ds-badge-success' : (#strings.toLowerCase(withdrawal.status) == 'rejected' ? 'ds-badge-danger' : 'ds-badge-warning')}"
                                                   th:text="${#strings.toLowerCase(withdrawal.status) == 'pending' ? 'Chờ duyệt' : (#strings.toLowerCase(withdrawal.status) == 'approved' ? 'Hoàn tất' : (#strings.toLowerCase(withdrawal.status) == 'rejected' ? 'Từ chối' : withdrawal.status))}">
                                             </span>
                                         </dd>
                                     </div>
                                    <div class="staff-info-row">
                                        <dt>Số tiền rút</dt>
                                        <dd class="ds-money"  th:text="${#numbers.formatInteger(withdrawal.amountVnd,0,'COMMA')}
                                         + ' đ'"></dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Ngày tạo</dt>
                                        <dd th:text="${#temporals.format(
                                        withdrawal.createdAt,
                                        'dd/MM/yyyy HH:mm')}">
                                        </dd>
                                    </div>
                                </dl>
                            </div>
                        </div>

                        <div class="ds-card">
                            <div class="ds-card-header">
                                <h2 class="ds-card-title">Thông tin ngân hàng</h2>
                            </div>
                            <div style="padding: 20px 24px;">
                                <dl class="staff-info-list">
                                    <div class="staff-info-row">
                                        <dt>Ngân hàng</dt>
                                        <dd th:text="${withdrawal.bankInfo.bankName}"></dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Số tài khoản</dt>
                                        <dd th:text="${withdrawal.bankInfo.accountNumber}"></dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Chủ tài khoản</dt>
                                        <dd th:text="${withdrawal.seller.fullName}"></dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Chi nhánh</dt>
                                        <dd th:text="${withdrawal.bankInfo.branch}"></dd>
                                    </div>
                                </dl>
                            </div>
                        </div>

                        <div class="ds-card">
                            <div class="ds-card-header">
                                <h2 class="ds-card-title">Kiểm tra số dư seller</h2>
                            </div>
                            <div style="padding: 20px 24px;">
                                <div class="ds-alert ds-alert-success"      th:text="'Số dư khả dụng: '
                                + ${#numbers.formatInteger(
                                withdrawal.seller.balanceVnd,
                                0,
                                'COMMA')}
                                 + ' đ'"></div>
                            </div>
                        </div>
                    </div>

                    <div class="ds-card staff-action-card staff-sticky-column">
                        <div class="ds-card-header">
                            <h2 class="ds-card-title">Quyết định rút tiền</h2>
                        </div>
                        <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
                            <div th:if="${success}"
                                 class="ds-alert ds-alert-success"
                                 th:text="${success}">
                            </div>

                            <div th:if="${warning}"
                                 class="ds-alert ds-alert-warning"
                                 th:text="${warning}">
                            </div>
                            <form th:action="@{/staff/withdrawals/update-status}"
                                  method="post" style="display: flex; flex-direction: column; gap: 16px;">

                                <input type="hidden"
                                       name="id"
                                       th:value="${withdrawal.id}">
                                <input type="hidden"
                                       name="token"
                                       id="form-token-input">

                                <!-- Nếu trạng thái là Pending: Hiển thị form duyệt hoặc từ chối -->
                                <div th:if="${withdrawal.status == 'Pending'}" style="display: flex; flex-direction: column; gap: 16px;">
                                    <input type="hidden" name="status" value="Approved">
                                    
                                    <div class="ds-form-field">
                                        <label class="ds-label">
                                            Lý do từ chối (chỉ điền khi từ chối)
                                        </label>
                                        <textarea class="ds-input" name="reason" rows="3" placeholder="Nhập lý do từ chối yêu cầu rút tiền..."></textarea>
                                    </div>

                                    <div class="ds-cluster" style="gap: 8px;">
                                        <button class="ds-btn ds-btn-success"
                                                type="submit" style="flex: 1;">
                                            <i class="fa fa-check"></i> Phê duyệt
                                        </button>

                                        <!-- Từ chối -->
                                        <button class="ds-btn ds-btn-danger"
                                                type="submit"
                                                th:formaction="@{/staff/withdrawals/reject}" style="flex: 1;">
                                            <i class="fa fa-times"></i> Từ chối
                                        </button>
                                    </div>
                                </div>

                                <!-- Nếu đã xử lý (Approved hoặc Rejected): Chỉ hiển thị trạng thái hiện tại -->
                                <div th:if="${withdrawal.status != 'Pending'}" style="display: flex; flex-direction: column; gap: 16px;">
                                    <div class="ds-form-field">
                                        <label class="ds-label">Trạng thái hiện tại</label>
                                        <div th:if="${withdrawal.status == 'Approved' || withdrawal.status == 'Completed'}" 
                                             class="ds-alert ds-alert-success" 
                                             style="font-weight: bold; text-align: center; font-size: 15px; margin: 0; background: #e6fcf5; color: #0ca678; border-color: #c3fae8;">
                                             <i class="fa fa-check-circle"></i> ĐÃ PHÊ DUYỆT
                                        </div>
                                        <div th:if="${withdrawal.status == 'Rejected'}" 
                                             class="ds-alert ds-alert-danger" 
                                             style="font-weight: bold; text-align: center; font-size: 15px; margin: 0; background: #fff5f5; color: #fa5252; border-color: #ffe3e3;">
                                             <i class="fa fa-times-circle"></i> ĐÃ TỪ CHỐI
                                        </div>
                                    </div>
                                    <div class="ds-form-field" th:if="${withdrawal.rejectionReason != null && !#strings.isEmpty(withdrawal.rejectionReason)}">
                                        <label class="ds-label">Lý do từ chối</label>
                                        <div class="ds-input" style="background-color: #f8fafc; min-height: 50px; font-weight: 500;" th:text="${withdrawal.rejectionReason}"></div>
                                    </div>
                                </div>
                            </form>
                            <div style="border-top: 1px solid var(--ds-border); padding-top: 16px; margin-top: 4px;">
                                <a class="ds-btn ds-btn-outline" href="/staff/withdrawals" style="width: 100%;">
                                    <i class="fa fa-arrow-left"></i> Quay lại danh sách
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/customer/auth.js}"></script>
<script th:src="@{/js/staff/staff-ui.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const token = sessionStorage.getItem('accessToken') || localStorage.getItem('accessToken');
        if (token) {
            const tokenInput = document.getElementById('form-token-input');
            if (tokenInput) {
                tokenInput.value = token;
            }
        }
    });
</script>
</body>
</html>
