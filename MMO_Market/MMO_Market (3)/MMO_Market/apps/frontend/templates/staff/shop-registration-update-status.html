<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/staff-head :: staffHead('Thay đổi trạng thái Shop')}"></th:block>
</head>
<body>
<header th:replace="~{fragments/header :: header}"></header>

<main class="staff-page">
    <div class="ds-container ds-page-shell">
        <div class="ds-two-column">
            <aside th:replace="~{fragments/staff-sidebar :: staffSidebar('shop-registrations')}"></aside>

            <section class="ds-section">
                <nav class="staff-breadcrumb">
                    <a href="/staff/shop-registrations">Quản lý Shop</a>
                    <span>/</span>
                    <span id="shopRequestCodeDisplay">Thay đổi trạng thái</span>
                </nav>

                <div class="staff-page-header">
                    <div>
                        <h1 class="ds-page-title">Thay đổi trạng thái Shop</h1>
                        <p class="ds-page-subtitle" id="shopRequestCodeSubtitle">Mã Shop: -</p>
                    </div>
                </div>

                <div class="staff-detail-grid">
                    <div class="ds-stack-md">
                        <div class="ds-card">
                            <div class="ds-card-header">
                                <h2 class="ds-card-title">Thông tin Shop hiện tại</h2>
                            </div>
                            <div style="padding: 20px 24px;">
                                <dl class="staff-info-list">
                                    <div class="staff-info-row">
                                        <dt>Mã Shop</dt>
                                        <dd id="shopCode">-</dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Tên Shop</dt>
                                        <dd id="shopName">-</dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Chủ sở hữu</dt>
                                        <dd id="shopOwnerName">-</dd>
                                    </div>
                                    <div class="staff-info-row">
                                        <dt>Trạng thái Shop hiện tại</dt>
                                        <dd>
                                            <span class="ds-badge ds-badge-info" id="currentShopStatusBadge">Đang tải</span>
                                        </dd>
                                    </div>
                                </dl>
                            </div>
                        </div>
                    </div>

                    <div class="ds-card staff-sticky-column">
                        <div class="ds-card-header">
                            <h2 class="ds-card-title">Cập nhật trạng thái hoạt động</h2>
                        </div>
                        <div style="padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;">
                            <div class="ds-form-field">
                                <label class="ds-label" for="shopStatusSelect">Trạng thái mới</label>
                                <select class="ds-input" id="shopStatusSelect">
                                    <option value="Active">Hoạt động</option>
                                    <option value="Suspended">Tạm ngưng</option>
                                    <option value="Locked">Tạm khóa</option>
                                    <option value="Banned">Khóa vĩnh viễn</option>
                                    <option value="Withdrawn">Đã đóng Shop (Hoàn phí)</option>
                                </select>
                            </div>
                            <button class="ds-btn ds-btn-primary" type="button" onclick="submitShopStatusUpdate()" style="width: 100%;">
                                <i class="fa fa-save"></i> Lưu cập nhật
                            </button>
                            <div style="border-top: 1px solid var(--ds-border); padding-top: 16px; margin-top: 4px;">
                                <a class="ds-btn ds-btn-outline" href="/staff/shop-registrations" style="width: 100%;">
                                    <i class="fa fa-arrow-left"></i> Quay lại danh sách
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script th:src="@{/js/customer/auth.js}"></script>
<script th:src="@{/js/staff/staff-shop-registration-update-status.js}"></script>
</body>
</html>
