<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

<aside class="seller-sidebar" th:fragment="sellerSidebar(activeMenu)">
    <div class="seller-sidebar__shop" aria-busy="true">
        <div class="seller-sidebar__avatar">...</div>
        <div class="seller-sidebar__identity">
            <strong class="seller-sidebar__name">Đang tải cửa hàng...</strong>
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span class="seller-sidebar__status" data-seller-shop-status style="font-size: 11px; color: var(--ds-text-subtle);">Đang tải trạng thái...</span>
                <span class="seller-sidebar__level-badge" style="font-size: 11px; font-weight: 700;"></span>
            </div>
        </div>
    </div>

    <div class="seller-sidebar__wallet">
        <div>
            <span class="seller-sidebar__wallet-label">Số dư khả dụng</span>
            <strong class="seller-sidebar__balance">Đang tải...</strong>
        </div>
    </div>

    <nav class="seller-sidebar__menu" aria-label="Menu người bán">
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'dashboard'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/dashboard}">
            <i class="fa fa-dashboard" aria-hidden="true"></i>
            <span>Tổng quan</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'messages'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/messages(sellerView=true)}">
            <i class="fa fa-comments" aria-hidden="true"></i>
            <span>Tin nhắn</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'shop-info'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/shop-info}">
            <i class="fa fa-shopping-basket" aria-hidden="true"></i>
            <span>Thông tin cửa hàng</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'product-add'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/products/new}">
            <i class="fa fa-plus-square-o" aria-hidden="true"></i>
            <span>Đăng bán sản phẩm</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'inventory'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/inventory}">
            <i class="fa fa-cubes" aria-hidden="true"></i>
            <span>Quản lý kho</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'preorders'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/preorders}">
            <i class="fa fa-calendar-check-o" aria-hidden="true"></i>
            <span>Đơn đặt trước</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'transactions'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/transactions}">
            <i class="fa fa-exchange" aria-hidden="true"></i>
            <span>Lịch sử bán hàng</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'complaints'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/complaints}">
            <i class="fa fa-warning" aria-hidden="true"></i>
            <span>Quản lý khiếu nại</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'reviews'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/reviews}">
            <i class="fa fa-star" aria-hidden="true"></i>
            <span>Quản lý đánh giá</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'shop-flags'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/shop-flags}">
            <i class="fa fa-flag" aria-hidden="true"></i>
            <span>Cờ cảnh báo Shop</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'withdrawals'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/withdrawals}">
            <i class="fa fa-money" aria-hidden="true"></i>
            <span>Rút tiền</span>
        </a>
        <a class="seller-sidebar__menu-link"
           th:classappend="${activeMenu == 'statistics'} ? ' seller-sidebar__menu-link--active' : ''"
           th:href="@{/seller/statistics}">
            <i class="fa fa-bar-chart" aria-hidden="true"></i>
            <span>Thống kê</span>
        </a>

        <div class="seller-sidebar__divider"></div>
        <a class="seller-sidebar__menu-link seller-sidebar__menu-link--logout"
           href="javascript:void(0)"
           onclick="if(typeof logout === 'function') logout(); else { sessionStorage.clear(); localStorage.removeItem('accessToken'); localStorage.removeItem('refreshToken'); localStorage.removeItem('loginTimestamp'); localStorage.removeItem('userInfo'); localStorage.removeItem('user'); window.location.href='/login'; }">
            <i class="fa fa-sign-out" aria-hidden="true"></i>
            <span>Đăng xuất</span>
        </a>
    </nav>

    <script>
        (() => {
            try {
                const rawUser = sessionStorage.getItem('userInfo') || sessionStorage.getItem('user');
                const user = rawUser ? JSON.parse(rawUser) : null;
                if (!user || user.id == null) return;

                const cacheKey = `sellerSidebarCache:${user.id}`;
                const rawCache = sessionStorage.getItem(cacheKey) || localStorage.getItem(cacheKey);
                const cached = rawCache ? JSON.parse(rawCache) : null;
                const balance = cached && cached.balanceVnd != null
                    ? cached.balanceVnd
                    : user.balanceVnd;

                const balanceEl = document.querySelector('.seller-sidebar__balance');
                if (balanceEl && balance != null) {
                    balanceEl.textContent = new Intl.NumberFormat('vi-VN', {
                        style: 'currency',
                        currency: 'VND'
                    }).format(Number(balance) || 0);
                }

                if (!cached || !cached.shopName) return;

                const statusMap = {
                    SUSPENDED: 'Tạm ngưng',
                    TEMP_LOCKED: 'Tạm ngưng',
                    TEMPORARILY_CLOSED: 'Tạm ngưng',
                    LOCKED: 'Tạm khóa',
                    INDEFINITE_LOCKED: 'Tạm khóa',
                    CLOSED: 'Tạm khóa',
                    BANNED: 'Khóa vĩnh viễn',
                    PERMANENT_BANNED: 'Khóa vĩnh viễn',
                    WITHDRAWN: 'Đã đóng Shop',
                    PENDING: 'Chờ duyệt'
                };
                const status = statusMap[String(cached.shopStatus || 'Active').toUpperCase()] || 'Hoạt động';

                const nameEl = document.querySelector('.seller-sidebar__name');
                const statusEl = document.querySelector('.seller-sidebar__status');
                const avatarEl = document.querySelector('.seller-sidebar__avatar');
                const shopEl = document.querySelector('.seller-sidebar__shop');

                if (nameEl) nameEl.textContent = cached.shopName;
                if (statusEl) statusEl.textContent = `Trạng thái: ${status}`;
                if (avatarEl) avatarEl.textContent = cached.shopName.charAt(0).toUpperCase();
                if (shopEl) shopEl.setAttribute('aria-busy', 'false');
            } catch (error) {}
        })();
    </script>
</aside>

</body>
</html>
