# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Spring Application Name
spring.application.name=MMO_Market_Schema

# Database Configuration (SQL Server)
spring.datasource.url=${DATABASE_URL:jdbc:sqlserver://localhost:1433;databaseName=MMO_System_Schema;trustServerCertificate=true;sendStringParametersAsUnicode=true;}
spring.datasource.username=${DATABASE_USERNAME:NNA}
spring.datasource.password=${DATABASE_PASSWORD:123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# SQL Server JDBC Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Transaction Configuration
spring.jpa.properties.hibernate.jdbc.use_sequences_for_key_generation=false


# JWT Configuration
app.jwtSecret=${JWT_SECRET:MMOMarketSystemSecretKeyForJWTTokenGenerationAndValidation2026}
app.jwtExpirationMs=86400000
app.jwtRefreshExpirationMs=604800000

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=target/spring.log

